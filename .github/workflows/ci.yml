name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :sdk:testDebugUnitTest

      - name: Lint
        run: ./gradlew :sdk:lintRelease

      - name: Assemble
        run: ./gradlew :sdk:assembleRelease :example:assembleDebug

      - name: Publish to the local Maven repository
        run: ./gradlew :sdk:publishToMavenLocal

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            sdk/build/reports
            sdk/build/test-results
